<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ICM custom performance dashboard</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --ink: #1c1915;
      --muted: #6b645b;
      --line: #ddd6c8;
      --paper: #fffdf8;
      --accent: #9a3412;
      --blocked: #a8a29e;
      --dns: #78716c;
      --connect: #57534e;
      --send: #b45309;
      --wait: #9a3412;
      --receive: #166534;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.45 "IBM Plex Sans", "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    header {
      padding: 28px 32px 8px;
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .sub {
      color: var(--muted);
      font-size: 13px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      max-width: 1200px;
      margin: 20px auto 0;
      padding: 0 32px;
    }
    .tabs button {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      padding: 8px 12px;
      cursor: pointer;
      font: inherit;
    }
    .tabs button.active {
      background: var(--ink);
      color: var(--paper);
      border-color: var(--ink);
    }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 32px 48px;
    }
    .kpis {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }
    @media (max-width: 900px) {
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    .kpi {
      background: var(--paper);
      border: 1px solid var(--line);
      padding: 16px 18px;
    }
    .kpi .label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .kpi .value {
      font-size: 22px;
      font-weight: 650;
      margin-top: 6px;
    }
    .kpi .hint {
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
      word-break: break-all;
    }
    h2 {
      font-size: 16px;
      margin: 28px 0 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--paper);
      border: 1px solid var(--line);
    }
    th, td {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    th {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    td.num, th.num { text-align: right; white-space: nowrap; }
    .path { word-break: break-all; }
    .wf {
      background: var(--paper);
      border: 1px solid var(--line);
    }
    .wf-row {
      display: grid;
      grid-template-columns: minmax(180px, 280px) 70px 1fr;
      gap: 10px;
      align-items: center;
      padding: 6px 10px;
      border-bottom: 1px solid var(--line);
    }
    .wf-row:last-child { border-bottom: 0; }
    .wf-label {
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .wf-time {
      font-size: 12px;
      text-align: right;
      color: var(--muted);
    }
    .track {
      position: relative;
      height: 14px;
      background: #efe8db;
    }
    .seg {
      position: absolute;
      top: 0;
      height: 100%;
    }
    .legend {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--muted);
      margin: 8px 0 12px;
    }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .swatch { width: 10px; height: 10px; display: inline-block; }
    .empty { color: var(--muted); padding: 16px 0; }
  </style>
</head>

  <script>
    const data = JSON.parse(document.getElementById("data").textContent);
    const tabs = document.getElementById("tabs");
    const kpis = document.getElementById("kpis");
    const top5 = document.getElementById("top5");
    const waterfall = document.getElementById("waterfall");
    const meta = document.getElementById("meta");
    let active = 0;

    function fmtBytes(n) {
      if (n >= 1048576) return (n / 1048576).toFixed(2) + " MB";
      if (n >= 1024) return (n / 1024).toFixed(1) + " KB";
      return n + " B";
    }
    function fmtMs(n) {
      if (n >= 1000) return (n / 1000).toFixed(2) + " s";
      return Math.round(n) + " ms";
    }

    function render() {
      const page = data.pages[active];
      meta.textContent = data.run + " · generated " + data.generatedAt + " · " + page.url;
      tabs.innerHTML = data.pages.map((p, i) =>
        `<button class="${i === active ? "active" : ""}" data-i="${i}">${p.name}</button>`
      ).join("");
      kpis.innerHTML = `
        <div class="kpi"><div class="label">Page load time</div><div class="value">${fmtMs(page.loadMs)}</div><div class="hint">HAR onLoad · ${page.requests} requests</div></div>
        <div class="kpi"><div class="label">Req size</div><div class="value">${fmtBytes(page.reqSize)}</div><div class="hint">Request headers + body, all calls</div></div>
        <div class="kpi"><div class="label">Res size</div><div class="value">${fmtBytes(page.resSize)}</div><div class="hint">Response transfer size on the wire</div></div>
        <div class="kpi"><div class="label">Highest file size</div><div class="value">${fmtBytes(page.highest.fileSize)}</div><div class="hint">${page.highest.path}</div></div>
      `;
      top5.innerHTML = `<table><thead><tr><th>#</th><th>Request</th><th class="num">Time</th><th class="num">Req size</th><th class="num">Res size</th></tr></thead><tbody>${
        page.top5.map((row, i) => `<tr><td>${i + 1}</td><td class="path">${row.method} ${row.path}</td><td class="num">${fmtMs(row.time)}</td><td class="num">${fmtBytes(row.reqSize)}</td><td class="num">${fmtBytes(row.resSize)}</td></tr>`).join("")
      }</tbody></table>`;

      const maxEnd = Math.max(...page.waterfall.map(r => r.start + r.time), page.loadMs, 1);
      waterfall.innerHTML = page.waterfall.map(row => {
        const colors = {
          blocked: "var(--blocked)",
          dns: "var(--dns)",
          ssl: "var(--connect)",
          connect: "var(--connect)",
          send: "var(--send)",
          wait: "var(--wait)",
          receive: "var(--receive)"
        };
        let offset = row.start;
        const segs = ["blocked","dns","connect","ssl","send","wait","receive"].map(key => {
          const dur = row.timings[key] || 0;
          const html = `<span class="seg" style="left:${(offset / maxEnd) * 100}%;width:${(dur / maxEnd) * 100}%;background:${colors[key]}"></span>`;
          offset += dur;
          return html;
        }).join("");
        return `<div class="wf-row"><div class="wf-label" title="${row.url}">${row.method} ${row.path}</div><div class="wf-time">${fmtMs(row.time)}</div><div class="track">${segs}</div></div>`;
      }).join("");
    }

    tabs.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      active = Number(button.dataset.i);
      render();
    });
    render();
  </script>
